<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Calorie Tracker (Gemini)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a22;--mut:#6b7a70;--bd:#e1e5df;--ac:#2f9e6b;--cal:#e8833a;--carb:#d9a21b;--pro:#3b82c4;--fat:#c9506b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--tx:#e8efe9;--mut:#93a39a;--bd:#2b3731}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b2420;--tx:#e8efe9;--mut:#93a39a;--bd:#2b3731}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.nav input{flex:1;min-width:0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}
textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row label,.lbl{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:6px}
.m{display:flex;justify-content:space-between;font-size:14px}
.m b{font-weight:600}.over{color:var(--fat)}
.e{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.e:first-child{border-top:0}.e div{flex:1;min-width:0}.e small{color:var(--mut)}
.x{background:none;color:var(--mut);padding:4px 8px;font-size:18px}
.msg{font-size:13px;color:var(--mut);margin-top:8px}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1}
</style></head><body><main>
<h1>🥗 Calorie Tracker</h1>
<div class="nav"><button class="g" id="prev">‹</button><input type="date" id="date"><button class="g" id="next">›</button></div>

<div class="card"><h2>Today's totals</h2><div id="sum"></div></div>

<div class="card" id="aiCard"><h2>✨ Describe what you ate (Gemini AI)</h2>
<textarea id="desc" placeholder="e.g. 2 rotis with dal and a bowl of curd, plus a banana"></textarea>
<div class="acts"><button id="est">Estimate &amp; add</button></div>
<div class="msg" id="aiMsg"></div></div>

<div class="card"><h2>Or log values manually</h2>
<input id="mn" placeholder="Food name (optional)" style="margin-bottom:8px">
<div class="row">
<div><label>Calories</label><input id="mc" type="number" min="0" inputmode="decimal"></div>
<div><label>Carbs (g)</label><input id="mb" type="number" min="0" inputmode="decimal"></div>
<div><label>Protein (g)</label><input id="mp" type="number" min="0" inputmode="decimal"></div>
<div><label>Fat (g)</label><input id="mf" type="number" min="0" inputmode="decimal"></div></div>
<div class="acts"><button id="add">Add entry</button></div></div>

<div class="card"><h2>Entries</h2><div id="list"></div></div>



<div class="card"><h2>Daily goals</h2>
<div class="row">
<div><label>Calories</label><input id="gc" type="number"></div>
<div><label>Carbs (g)</label><input id="gb" type="number"></div>
<div><label>Protein (g)</label><input id="gp" type="number"></div>
<div><label>Fat (g)</label><input id="gf" type="number"></div></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const K=[["calories","Calories","kcal","--cal","gc"],["carbs","Carbs","g","--carb","gb"],["protein","Protein","g","--pro","gp"],["fat","Fat","g","--fat","gf"]];
let data={},goals={calories:2000,carbs:250,protein:100,fat:65},day=iso(new Date()),sample=null;
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
function load(){try{const s=JSON.parse(localStorage.getItem("cal-tracker")||"{}");data=s.data||{};goals=s.goals||goals}catch(e){}}
function save(){try{localStorage.setItem("cal-tracker",JSON.stringify({data,goals}))}catch(e){}}
function entries(){return data[day]||(data[day]=[])}
function addEntry(e){entries().push({name:e.name||"Food",calories:+e.calories||0,carbs:+e.carbs||0,protein:+e.protein||0,fat:+e.fat||0});save();render()}
function render(){
 $("date").value=day;const es=entries();
 const t={calories:0,carbs:0,protein:0,fat:0};es.forEach(e=>K.forEach(k=>t[k[0]]+=e[k[0]]));
 $("sum").innerHTML=K.map(([k,n,u,c])=>{const g=goals[k]||0,p=g?Math.min(100,t[k]/g*100):0,left=g-t[k];
  return `<div class="m"><span>${n}</span><span><b>${Math.round(t[k])}</b> / ${g} ${u} · <span class="${left<0?'over':''}">${left<0?Math.round(-left)+' over':Math.round(left)+' left'}</span></span></div><div class="bar"><i style="width:${p}%;background:var(${c})"></i></div>`}).join("");
 $("list").innerHTML=es.length?es.map((e,i)=>`<div class="e"><div><b></b><br><small>${Math.round(e.calories)} kcal · C ${Math.round(e.carbs)}g · P ${Math.round(e.protein)}g · F ${Math.round(e.fat)}g</small></div><button class="x" data-i="${i}">✕</button></div>`).join(""):'<div class="msg">Nothing logged for this day yet.</div>';
 $("list").querySelectorAll(".e b").forEach((b,i)=>b.textContent=es[i].name);
 $("list").querySelectorAll(".x").forEach(b=>b.onclick=()=>{entries().splice(+b.dataset.i,1);save();render()});
 K.forEach(k=>$(k[4]).value=goals[k[0]]);
}
function shift(n){const d=new Date(day+"T12:00:00");d.setDate(d.getDate()+n);day=iso(d);render()}
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("date").onchange=e=>{if(e.target.value){day=e.target.value;render()}};
K.forEach(k=>$(k[4]).onchange=e=>{goals[k[0]]=+e.target.value||0;save();render()});
$("add").onclick=()=>{
 const v={name:$("mn").value.trim()||"Manual entry",calories:$("mc").value,carbs:$("mb").value,protein:$("mp").value,fat:$("mf").value};
 if(!(+v.calories||+v.carbs||+v.protein||+v.fat))return;
 addEntry(v);["mn","mc","mb","mp","mf"].forEach(i=>$(i).value="")};
const PROXY_URL="https://calorie-ai.shyamcharan-mangu2022.workers.dev/"; // e.g. https://calorie-ai.yourname.workers.dev
$("est").onclick=async()=>{
 const text=$("desc").value.trim();if(!text)return;
 if(PROXY_URL.startsWith("PASTE")){$("aiMsg").textContent="Site owner: set PROXY_URL in the HTML first.";return}
 $("est").disabled=true;$("aiMsg").textContent="Estimating…";
 try{
  const res=await fetch(PROXY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
  const j=await res.json();
  if(!res.ok)throw new Error(j.error||"Request failed");
  const items=j.items||[];if(!items.length)throw new Error("No food found in that description");
  items.forEach(addEntry);$("desc").value="";
  $("aiMsg").textContent="Added "+items.length+" item(s). Estimates are approximate.";
 }catch(e){$("aiMsg").textContent="Couldn't estimate: "+(e.message||"error")+". You can log manually below."}
 $("est").disabled=false};
load();render();
</script></body></html>
